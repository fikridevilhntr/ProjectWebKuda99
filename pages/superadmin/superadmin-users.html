
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#166534">
  <meta name="description" content="Kelola akun dan hak akses pengguna EcoSort.">
  <title>Manajemen Pengguna | EcoSort</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icon/favicon.svg">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div id="app-root"></div>

  <noscript>
    <p>Aktifkan JavaScript untuk menggunakan EcoSort.</p>
  </noscript>

  <script type="module">
    import { showToast as showSharedToast, confirmLogout } from "../../js/components/feedback.js";
    import {
      getActiveSession,
      logout
    } from "../../js/core/auth.js";

    import {
      allowedPagesForRole,
      pageFromHash
    } from "../../js/core/router.js";

    import {
      renderSidebar,
      bindSidebar,
      renderHeader,
      bindHeader
    } from "../../js/core/layout.js";

    import {
      createDataPage
    } from "../../js/modules/data-page.js";


    /* SESSION AND ROLE ACCESS */

    const ROLE = "Super Admin";
    const session = getActiveSession();

    const ROLE_HOME = {
      "User": "../user/user-dashboard.html",
      "Sub Admin": "../subadmin/subadmin-dashboard.html",
      "Super Admin": "./superadmin-dashboard.html"
    };

    if (!session) {
      window.location.replace("../login.html");
      throw new Error("ECOSORT: Sesi tidak ditemukan.");
    }

    if (session.role !== ROLE) {
      window.location.replace(
        ROLE_HOME[session.role] || "../login.html"
      );
      throw new Error("ECOSORT: Role tidak sesuai.");
    }


    /* ROOT AND ROUTES */

    const root = document.getElementById("app-root");

    if (!root) {
      throw new Error("ECOSORT: App root tidak ditemukan.");
    }

    const allowedPages = allowedPagesForRole(ROLE);

    const PAGE_ROUTES = {

        dashboard: "./superadmin-dashboard.html",

        users: "./superadmin-users.html",

        waste: "./superadmin-waste-page.html",

        guides: "./superadmin-guides-page.html",

        dataset: "./superadmin-dataset-page.html",

        model: "./superadmin-model-page.html",

        reports: "../reports.html",

        profile: "../user/user-profile.html",

        settings: "../settings.html"

        };

    let sidebarOpen = false;
    let removeHeaderEvents = () => {};
    let removeDataPageEvents = () => {};
    let toastTimer = null;


    /* TOAST NOTIFICATION */

    function showToast(message, tone = "success") {
      showSharedToast(message, tone);
    }


    /* NAVIGATION */

    function navigate(page) {
      if (!allowedPages.has(page)) {
        showToast(
          "Kamu tidak memiliki akses ke halaman tersebut.",
          "error"
        );
        return false;
      }

      const destination = PAGE_ROUTES[page];
      if (!destination) return false;

      const target = new URL(destination, window.location.href);
      target.hash = `app/${page}`;
      window.location.assign(target.href);

      return true;
    }


    /* LOGOUT */

    async function handleLogout() {
      const confirmed = await confirmLogout();
      if (!confirmed) return;

      if (logout()) {
        window.location.assign("../landing.html");
      } else {
        showToast("Gagal keluar dari akun.", "error");
      }
    }


    /* SIDEBAR STATE */

    function setSidebarOpen(open) {
      sidebarOpen = Boolean(open);
      renderApplication();
    }


    /* RENDER APPLICATION */

    function renderApplication() {
      removeHeaderEvents();
      removeDataPageEvents();

      root.innerHTML = `
        <div class="app-shell">

          ${renderSidebar({
            role: ROLE,
            page: "users",
            open: sidebarOpen
          })}

          <div class="app-main">

            ${renderHeader({ role: ROLE })}

            <main>
              <div id="users-content"></div>
            </main>

          </div>

          ${sidebarOpen
            ? '<div class="side-overlay" data-action="close-overlay"></div>'
            : ""
          }

        </div>

        <div id="toast-root" aria-live="polite"></div>
      `;

      const contentRoot = root.querySelector("#users-content");

      const dataPage = createDataPage({
        kind: "users",
        onToast: showToast
      });

      removeDataPageEvents = dataPage.mount(contentRoot);

      bindSidebar(root.querySelector(".sidebar"), {
        setPage: navigate,
        setOpen: setSidebarOpen,
        onLogout: handleLogout
      });

      removeHeaderEvents = bindHeader(
        root.querySelector(".app-header"),
        {
          role: ROLE,
          onMenu: () => setSidebarOpen(true),
          onNavigate: navigate
        }
      );

      root.querySelector('[data-action="close-overlay"]')
        ?.addEventListener("click", () => setSidebarOpen(false));
    }


    /* INITIAL PAGE */

    const requestedPage = pageFromHash();

    if (requestedPage && requestedPage !== "users") {
      if (!navigate(requestedPage)) {
        window.history.replaceState(null, "", "#app/users");
        renderApplication();
      }
    } else {
      if (!requestedPage) {
        window.history.replaceState(null, "", "#app/users");
      }

      renderApplication();
    }


    /* CLEANUP */

    window.addEventListener("pagehide", () => {
      removeHeaderEvents();
      removeDataPageEvents();

      if (toastTimer) {
        window.clearTimeout(toastTimer);
      }
    }, { once: true });

  </script>
</body>
</html>
