
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#166534">

  <title>Dashboard Super Admin | EcoSort</title>

  <link rel="icon" href="../../assets/icon/favicon.svg">
  <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

  <div id="app-root"></div>

  <noscript>
    <p>Aktifkan JavaScript untuk menggunakan EcoSort.</p>
  </noscript>

  <script type="module">

    import {
      getActiveSession,
      logout
    } from "../../js/core/auth.js";

    import {
      allowedPagesForRole,
      pageFromHash
    } from "../../js/core/router.js";

    import {
      renderSidebar,
      bindSidebar,
      renderHeader,
      bindHeader,
      showLogoutConfirm
    } from "../../js/core/layout.js";

    import {
      renderAdminDashboard
    } from "../../js/core/dashboard.js";


    /* =====================================
       SESSION VALIDATION
    ===================================== */

    const ROLE = "Super Admin";

    const session = getActiveSession();

    const roleHome = {

      "User": "../user/user-dashboard.html",

      "Sub Admin": "../subadmin/subadmin-dashboard.html",

      "Super Admin": "./superadmin-dashboard.html"

    };

    if (!session) {

      window.location.replace("../login.html");

      throw new Error(
        "ECOSORT: Session tidak ditemukan."
      );

    }

    if (session.role !== ROLE) {

      window.location.replace(
        roleHome[session.role] || "../login.html"
      );

      throw new Error(
        "ECOSORT: Role tidak sesuai."
      );

    }


    /* =====================================
       ROOT ELEMENT
    ===================================== */

    const root = document.getElementById("app-root");

    if (!root) {

      throw new Error(
        "ECOSORT: App root tidak ditemukan."
      );

    }


    /* =====================================
       PAGE ROUTES
    ===================================== */

    const PAGE_ROUTES = {

      dashboard: "./superadmin-dashboard.html",

      users: "./superadmin-users.html",

      waste: "./superadmin-waste-page.html",

      guides: "./superadmin-guides-page.html",

      dataset: "./superadmin-dataset-page.html",

      model: "./superadmin-model-page.html",

      reports: "../reports.html",

      profile: "../user/user-profile.html",

      settings: "../settings.html"

    };


    const allowedPages =
      allowedPagesForRole(ROLE);

    let sidebarOpen = false;

    let removeHeaderEvents = () => {};


    /* =====================================
       NAVIGATION
    ===================================== */

    function navigate(page) {

      if (!allowedPages.has(page)) {
        return false;
      }

      const destination = PAGE_ROUTES[page];

      if (!destination) {
        return false;
      }

      const target = new URL(
        destination,
        window.location.href
      );

      target.hash = `app/${page}`;

      window.location.assign(target.href);

      return true;

    }


    /* =====================================
       LOGOUT
    ===================================== */

    function handleLogout() {

      showLogoutConfirm({

        onConfirm: () => {

          if (!logout()) {

            console.error(
              "ECOSORT: Gagal mengakhiri sesi."
            );

            return;

          }

          window.location.assign("../landing.html");

        }

      });

    }


    /* =====================================
       RENDER DASHBOARD
    ===================================== */

    function renderDashboard() {

      removeHeaderEvents();

      root.innerHTML = `

        <div class="app-shell">

          ${renderSidebar({

            role: ROLE,

            page: "dashboard",

            open: sidebarOpen

          })}

          <div class="app-main">

            ${renderHeader({

              role: ROLE

            })}

            <main>

              ${renderAdminDashboard(ROLE)}

            </main>

          </div>

          ${
            sidebarOpen
              ? '<div class="side-overlay" data-action="close-overlay"></div>'
              : ""
          }

        </div>

      `;


      /* SIDEBAR EVENTS */

      const sidebar =
        root.querySelector(".sidebar");

      bindSidebar(sidebar, {

        setPage: navigate,

        setOpen: open => {

          sidebarOpen = open;

          renderDashboard();

        },

        onLogout: handleLogout

      });


      /* HEADER EVENTS */

      const header =
        root.querySelector(".app-header");

      removeHeaderEvents = bindHeader(header, {

        role: ROLE,

        onMenu: () => {

          sidebarOpen = true;

          renderDashboard();

        },

        onNavigate: navigate

      });


      /* MOBILE SIDEBAR OVERLAY */

      root
        .querySelector('[data-action="close-overlay"]')
        ?.addEventListener("click", () => {

          sidebarOpen = false;

          renderDashboard();

        });

    }


    /* =====================================
       DASHBOARD CONTENT EVENTS
    ===================================== */

    root.addEventListener("click", event => {

      const pageButton = event.target.closest(
        ".app-main [data-page]"
      );

      if (!pageButton) return;

      navigate(pageButton.dataset.page);

    });


    /* =====================================
       RESTORE NAVIGATION
    ===================================== */

    const requestedPage = pageFromHash();

    if (
      requestedPage &&
      requestedPage !== "dashboard"
    ) {

      if (!navigate(requestedPage)) {

        renderDashboard();

      }

    } else {

      if (!requestedPage) {

        window.history.replaceState(
          null,
          "",
          "#app/dashboard"
        );

      }

      renderDashboard();

    }


    /* =====================================
       CLEANUP
    ===================================== */

    window.addEventListener(
      "pagehide",
      removeHeaderEvents,
      { once: true }
    );

  </script>

</body>
</html>
