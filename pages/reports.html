
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#166534">
  <meta name="description" content="Ringkasan aktivitas klasifikasi dan pengelolaan data EcoSort.">

  <title>Laporan | EcoSort</title>

  <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">

  <style>
    .period-select {
      height: 39px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #475569;
      padding: 0 11px;
      font-size: 10px;
    }

    @media (max-width: 720px) {
      .period-select {
        width: 100%;
      }
    }

    /* ECO SORT - CUSTOM LOGOUT CONFIRMATION */

    .report-logout-backdrop {
      position: fixed;
      inset: 0;
      z-index: 12000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 23, 42, .48);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .report-logout-backdrop[hidden] {
      display: none !important;
    }

    .report-logout-modal {
      width: min(100%, 440px);
      overflow: hidden;
      border: 1px solid var(--line, #e2e8f0);
      border-radius: 16px;
      background: var(--surface, #fff);
      color: var(--text, #0f172a);
      box-shadow: 0 24px 70px rgba(15, 23, 42, .22);
      animation: reportLogoutIn .18s ease-out;
    }

    @keyframes reportLogoutIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .report-logout-head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 24px 24px 18px;
    }

    .report-logout-icon {
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #fef2f2;
      color: #dc2626;
      font-size: 23px;
      font-weight: 700;
    }

    .report-logout-copy {
      min-width: 0;
      flex: 1;
    }

    .report-logout-copy h2 {
      margin: 1px 0 7px;
      color: var(--text, #0f172a);
      font-size: 17px;
      font-weight: 750;
      line-height: 1.35;
    }

    .report-logout-copy p {
      margin: 0;
      color: var(--muted, #64748b);
      font-size: 12px;
      line-height: 1.65;
    }

    .report-logout-close {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted, #64748b);
      font-size: 23px;
      line-height: 1;
      cursor: pointer;
    }

    .report-logout-close:hover {
      background: var(--bg, #f8fafc);
      color: var(--text, #0f172a);
    }

    .report-logout-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 24px 22px;
      border-top: 1px solid var(--line, #e2e8f0);
    }

    .report-logout-actions .btn {
      min-width: 108px;
      min-height: 42px;
      font-size: 12px;
    }

    .report-logout-actions .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .report-logout-actions .btn-danger:hover {
      background: #b91c1c;
    }

    .report-logout-modal button:focus-visible {
      outline: 3px solid rgba(34, 197, 94, .35);
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      .report-logout-backdrop {
        padding: 14px;
      }

      .report-logout-head {
        padding: 20px 18px 16px;
      }

      .report-logout-actions {
        padding: 14px 18px 18px;
      }

      .report-logout-actions .btn {
        flex: 1;
        min-width: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .report-logout-modal {
        animation: none;
      }
    }

  </style>
</head>

<body>

  <div id="app-root"></div>

  <noscript>
    <p>Aktifkan JavaScript untuk menggunakan EcoSort.</p>
  </noscript>

  <script type="module">
    import { showToast as showSharedToast, confirmLogout } from "../js/components/feedback.js";

    import {
      getActiveSession,
      logout
    } from "../js/core/auth.js";

    import {
      getHistory,
      toCsv,
      downloadFile
    } from "../js/core/database.js";

    import {
      allowedPagesForRole,
      pageFromHash
    } from "../js/core/router.js";

    import {
      renderSidebar,
      bindSidebar,
      renderHeader,
      bindHeader,
      renderStatCard
    } from "../js/core/layout.js";


    /* =====================================
       SESSION AND ROLE ACCESS
    ===================================== */

    const session = getActiveSession();

    if (!session) {
      window.location.replace("./login.html");

      throw new Error(
        "ECOSORT: Session tidak ditemukan."
      );
    }

    const role = session.role;

    const allowedPages =
      allowedPagesForRole(role);

    const ROLE_HOME = {
      "User": "./user/user-dashboard.html",
      "Sub Admin": "./subadmin/subadmin-dashboard.html",
      "Super Admin": "./superadmin/superadmin-dashboard.html"
    };

    if (!allowedPages.has("reports")) {

      window.location.replace(
        ROLE_HOME[role] || "./landing.html"
      );

      throw new Error(
        "ECOSORT: Akses laporan ditolak."
      );
    }


    /* =====================================
       PAGE ROUTES
    ===================================== */

    const PAGE_ROUTES = {

      "Super Admin": {

        dashboard: "./superadmin/superadmin-dashboard.html",

        users: "./superadmin/superadmin-users.html",

        waste: "./superadmin/superadmin-waste-page.html",

        guides: "./superadmin/superadmin-guides-page.html",

        dataset: "./superadmin/superadmin-dataset-page.html",

        model: "./superadmin/superadmin-model-page.html",

        reports: "./reports.html",

        profile: "./user/user-profile.html",

        settings: "./settings.html"

      },

      "Sub Admin": {

        dashboard: "./subadmin/subadmin-dashboard.html",

        waste: "./subadmin/subadmin-waste.html",

        guides: "./subadmin/subadmin-guides.html",

        reports: "./reports.html",

        profile: "./user/user-profile.html",

        settings: "./settings.html"

      }

    };


    /* =====================================
       ROOT
    ===================================== */

    const root = document.getElementById(
      "app-root"
    );

    if (!root) {

      throw new Error(
        "ECOSORT: App root tidak ditemukan."
      );

    }

    let sidebarOpen = false;

    let toastTimer = null;

    let unbindHeader = () => {};


    /* =====================================
       TOAST
    ===================================== */

    function showToast(message, tone = "success") {
      showSharedToast(message, tone);
    }


    /* =====================================
       REPORT EXPORT
    ===================================== */

    function downloadReport() {

      const histories = getHistory();

      if (
        !Array.isArray(histories) ||
        histories.length === 0
      ) {

        showToast(
          "Belum ada riwayat klasifikasi untuk dilaporkan.",
          "error"
        );

        return;

      }

      const rows = histories.map(record => ({

        tanggal: record.date || "",

        item: record.name || "",

        kategori: record.category || "",

        rekomendasi: record.recommendation || ""

      }));

      try {

        const filename =
          `laporan-ecosort-${new Date().toISOString().slice(0, 10)}.csv`;

        downloadFile(
          filename,
          toCsv(rows)
        );

        showToast(
          "Laporan CSV berhasil diunduh."
        );

      } catch (error) {

        console.error(
          "ECOSORT: Ekspor laporan gagal.",
          error
        );

        showToast(
          "Laporan gagal diunduh. Silakan coba kembali.",
          "error"
        );

      }

    }


    /* =====================================
       NAVIGATION
    ===================================== */

    function navigate(page) {

      if (!allowedPages.has(page)) {

        showToast(
          "Kamu tidak memiliki akses ke halaman tersebut.",
          "error"
        );

        return false;

      }

      const destination =
        PAGE_ROUTES[role]?.[page];

      if (!destination) {

        showToast(
          "Rute halaman belum tersedia.",
          "error"
        );

        return false;

      }

      if (page === "reports") {

        if (window.location.hash !== "#app/reports") {

          window.history.pushState(
            null,
            "",
            "#app/reports"
          );

        }

        setSidebarOpen(false);

        return true;

      }

      const target = new URL(
        destination,
        window.location.href
      );

      target.hash = `app/${page}`;

      window.location.assign(target.href);

      return true;

    }


    /* =====================================
       LOGOUT - CUSTOM ECOSORT MODAL
    ===================================== */

    async function handleLogout() {
      const confirmed = await confirmLogout();
      if (!confirmed) return;

      if (logout()) {
        window.location.assign("./landing.html");
      } else {
        showToast("Gagal keluar dari akun.", "error");
      }
    }


    function closeLogoutModal() {

      const host = root.querySelector(
        "#logout-modal-root"
      );

      if (host) {
        host.innerHTML = "";
      }

      root.querySelector(
        '.sidebar [data-action="logout"]'
      )?.focus();

    }


    function completeLogout() {

      if (!logout()) {

        closeLogoutModal();

        showToast(
          "Gagal keluar dari akun.",
          "error"
        );

        return;

      }

      closeLogoutModal();

      showToast(
        "Berhasil keluar dari akun."
      );

      window.setTimeout(() => {

        window.location.assign(
          "./landing.html"
        );

      }, 900);

    }


    function handleLogoutModalKeydown(event) {

      const modal = root.querySelector(
        ".report-logout-modal"
      );

      if (!modal) return;

      if (event.key === "Escape") {

        event.preventDefault();

        closeLogoutModal();

        return;

      }

      if (event.key !== "Tab") return;

      const focusable = Array.from(
        modal.querySelectorAll(
          'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
        )
      );

      if (!focusable.length) return;

      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      if (event.shiftKey && document.activeElement === first) {

        event.preventDefault();
        last.focus();

      } else if (!event.shiftKey && document.activeElement === last) {

        event.preventDefault();
        first.focus();

      }

    }


    /* =====================================
       SIDEBAR STATE
    ===================================== */

    function setSidebarOpen(open) {

      sidebarOpen = Boolean(open);

      const sidebar = root.querySelector(
        ".sidebar"
      );

      const overlay = root.querySelector(
        ".side-overlay"
      );

      sidebar?.classList.toggle(
        "sidebar-open",
        sidebarOpen
      );

      if (overlay) {

        overlay.style.display =
          sidebarOpen ? "block" : "none";

      }

    }


    /* =====================================
       ORIGINAL BAR CHART
    ===================================== */

    function renderBarChart() {

      const values = [
        42, 58, 48, 74, 63, 82, 72
      ];

      const days = [
        "Sen",
        "Sel",
        "Rab",
        "Kam",
        "Jum",
        "Sab",
        "Min"
      ];

      return `

        <div class="bar-chart">

          <div class="y-labels">

            <span>100</span>
            <span>75</span>
            <span>50</span>
            <span>25</span>
            <span>0</span>

          </div>

          <div class="bars">

            ${values.map((value, index) => `

              <div class="bar-col">

                <div
                  class="bar"
                  style="height:${value}%"
                >

                  <span>${value}</span>

                </div>

                <small>
                  ${days[index]}
                </small>

              </div>

            `).join("")}

          </div>

        </div>

      `;

    }


    /* =====================================
       ORIGINAL DONUT CHART
    ===================================== */

    function renderDonut() {

      return `

        <div class="donut">

          <div>

            <b>3.856</b>

            <span>Total</span>

          </div>

        </div>

        <div class="legend">

          <span>
            <i class="org"></i>
            Organik
            <b>48%</b>
          </span>

          <span>
            <i class="anorg"></i>
            Anorganik
            <b>34%</b>
          </span>

          <span>
            <i class="res"></i>
            Residu
            <b>18%</b>
          </span>

        </div>

      `;

    }


    /* =====================================
       RENDER REPORT PAGE
    ===================================== */

    function renderApplication() {

      unbindHeader();

      root.innerHTML = `

        <div class="app-shell">

          ${renderSidebar({

            role,

            page: "reports",

            open: sidebarOpen

          })}


          <div class="app-main">

            ${renderHeader({

              role

            })}


            <main>

              <!-- PAGE TITLE -->

              <div class="page-title">

                <div>

                  <h1>Laporan</h1>

                  <p>
                    Ringkasan aktivitas klasifikasi dan pengelolaan data.
                  </p>

                </div>


                <div class="page-title-actions">

                  <select
                    class="period-select"
                    id="report-period"
                    aria-label="Pilih periode laporan"
                  >

                    <option>7 hari terakhir</option>

                    <option selected>
                      30 hari terakhir
                    </option>

                    <option>Semua waktu</option>

                  </select>


                  <button
                    class="btn btn-primary"
                    type="button"
                    data-report-action="export"
                  >

                    Unduh laporan

                  </button>

                </div>

              </div>


              <!-- STATISTICS -->

              <div class="stats-grid">

                ${renderStatCard({

                  title: "Total klasifikasi",

                  value: "3.856",

                  change: "12,5%",

                  icon: "classify"

                })}


                ${renderStatCard({

                  title: "Organik",

                  value: "1.851",

                  change: "8,2%",

                  icon: "logo"

                })}


                ${renderStatCard({

                  title: "Anorganik",

                  value: "1.311",

                  change: "4,8%",

                  icon: "waste",

                  tone: "blue"

                })}


                ${renderStatCard({

                  title: "Residu",

                  value: "694",

                  change: "2,1%",

                  icon: "close",

                  tone: "yellow"

                })}

              </div>


              <!-- CHARTS -->

              <div class="dashboard-grid">


                <!-- ACTIVITY CHART -->

                <section class="panel chart-panel">

                  <div class="panel-head">

                    <div>

                      <h3>
                        Aktivitas klasifikasi
                      </h3>

                      <p id="report-period-caption">
                        30 hari terakhir · data demonstrasi antarmuka
                      </p>

                    </div>

                  </div>

                  ${renderBarChart()}

                </section>


                <!-- CATEGORY DISTRIBUTION -->

                <section class="panel distribution">

                  <div class="panel-head">

                    <div>

                      <h3>
                        Distribusi kategori
                      </h3>

                    </div>

                  </div>

                  ${renderDonut()}

                </section>

              </div>

            </main>

          </div>


          <!-- SIDEBAR OVERLAY -->

          <div
            class="side-overlay"
            data-report-action="close-overlay"
            style="display:none"
          ></div>

        </div>


        <!-- LOGOUT CONFIRMATION MODAL -->

        <div id="logout-modal-root"></div>


        <!-- TOAST -->

        <div
          id="toast-root"
          aria-live="polite"
        ></div>

      `;


      /* =====================================
         BIND SIDEBAR
      ===================================== */

      const sidebar = root.querySelector(
        ".sidebar"
      );

      bindSidebar(sidebar, {

        setPage: navigate,

        setOpen: setSidebarOpen,

        onLogout: handleLogout

      });


      /* =====================================
         BIND HEADER
      ===================================== */

      const header = root.querySelector(
        ".app-header"
      );

      unbindHeader = bindHeader(header, {

        role,

        onMenu: () =>
          setSidebarOpen(true),

        onNavigate: navigate

      });


      /* =====================================
         PERIOD SELECTOR
      ===================================== */

      const period = root.querySelector(
        "#report-period"
      );

      const caption = root.querySelector(
        "#report-period-caption"
      );

      period.addEventListener(
        "change",
        () => {

          caption.textContent =
            `${period.value} · data demonstrasi antarmuka`;

        }
      );


      /* =====================================
         ROOT CLICK EVENTS
      ===================================== */

      root.addEventListener(
        "click",
        handleRootClick
      );

    }


    /* =====================================
       ROOT ACTIONS
    ===================================== */

    function handleRootClick(event) {

      const action = event.target.closest(
        "[data-report-action]"
      );

      if (!action) return;

      switch (action.dataset.reportAction) {

        case "export":

          downloadReport();

          break;


        case "close-overlay":

          setSidebarOpen(false);

          break;


        case "cancel-logout":

          closeLogoutModal();

          break;


        case "confirm-logout":

          completeLogout();

          break;


        case "close-logout-backdrop":

          if (event.target === action) {
            closeLogoutModal();
          }

          break;


        case "dismiss-toast": {

          const host = root.querySelector(
            "#toast-root"
          );

          if (host) {
            host.innerHTML = "";
          }

          if (toastTimer) {

            window.clearTimeout(toastTimer);

            toastTimer = null;

          }

          break;

        }

      }

    }


    /* =====================================
       INITIALIZATION
    ===================================== */

    const requestedPage = pageFromHash();

    if (
      requestedPage &&
      requestedPage !== "reports"
    ) {

      if (!navigate(requestedPage)) {
        renderApplication();
      }

    } else {

      if (!requestedPage) {

        window.history.replaceState(
          null,
          "",
          "#app/reports"
        );

      }

      renderApplication();

    }

    window.addEventListener(
      "keydown",
      handleLogoutModalKeydown
    );


    /* =====================================
       CLEANUP
    ===================================== */

    window.addEventListener(
      "pagehide",
      () => {

        if (toastTimer) {
          window.clearTimeout(toastTimer);
        }

        unbindHeader();

        window.removeEventListener(
          "keydown",
          handleLogoutModalKeydown
        );

      },
      { once: true }
    );

  </script>

</body>
</html>
