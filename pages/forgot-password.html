<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#166534">
  <meta name="description" content="Pemulihan akun EcoSort.">
  <title>Lupa Kata Sandi - EcoSort</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="auth-root"></div>

  <noscript>
    <p>EcoSort membutuhkan JavaScript. Silakan aktifkan JavaScript pada browser Anda.</p>
  </noscript>

  <script type="module">
    import {
      renderAuthView,
      bindAuthView
    } from "../js/components/auth-view.js";

    import {
      submitAuthentication
    } from "../js/core/auth.js";

    const root = document.getElementById("auth-root");

    if (!root) {
      throw new Error("ECOSORT: Auth root tidak ditemukan.");
    }

    const state = {
      mode: "forgot",
      role: "User",
      name: "",
      email: "",
      password: "",
      remember: false,
      showPassword: false,
      loading: false,
      errors: {},
      message: ""
    };

    let unbindView = () => {};

    function cleanupView() {
      unbindView();
      unbindView = () => {};
    }

    function renderForgotPassword() {
      cleanupView();

      root.innerHTML = renderAuthView(state);

      unbindView = bindAuthView(root, {
        onSubmit: values => handleRecovery(values),

        onModeChange: mode => {
          if (mode === "login") {
            window.location.assign("./login.html");
          } else if (mode === "register") {
            window.location.assign("./register.html");
          }
        }
      });
    }

    async function handleRecovery(values) {
      if (state.loading) return;

      state.email = values.email || "";
      state.loading = true;
      state.errors = {};
      state.message = "";

      renderForgotPassword();

      try {
        const result = await submitAuthentication({
          mode: "forgot",
          email: state.email
        });

        state.loading = false;

        if (!result.success) {
          state.errors = result.errors || {};
          state.message = result.message || "";
          renderForgotPassword();
          return;
        }

        if (result.action === "forgot") {
          state.errors = {};
          state.message = result.message || "";
          renderForgotPassword();
          return;
        }

        state.message = "Permintaan pemulihan tidak dapat diproses.";
        renderForgotPassword();

      } catch (error) {
        console.error("ECOSORT: Password recovery error.", error);

        state.loading = false;
        state.message =
          error.message ||
          "Terjadi kesalahan. Silakan coba kembali.";

        renderForgotPassword();
      }
    }

    renderForgotPassword();
  </script>
</body>
</html>
